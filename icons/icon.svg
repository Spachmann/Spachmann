<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nebenkostenabrechnung">
  <defs>
    <linearGradient id="verlauf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cf6"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#verlauf)"/>

  <!-- Abrechnungsbeleg -->
  <path d="M136 96h190l50 50v250a30 30 0 0 1-30 30H136a30 30 0 0 1-30-30V126a30 30 0 0 1 30-30z"
        fill="#ffffff" opacity=".96"/>
  <path d="M326 96l50 50h-50z" fill="#c8d8f6"/>

  <!-- Kostenzeilen: zwei umlagefähig (blau), eine nicht umlagefähig (rot, durchgestrichen) -->
  <g fill="#2f7cf6">
    <rect x="146" y="190" width="130" height="18" rx="9"/>
    <rect x="146" y="238" width="160" height="18" rx="9"/>
  </g>
  <rect x="146" y="286" width="110" height="18" rx="9" fill="#d94a54" opacity=".55"/>
  <path d="M138 295h128" stroke="#d94a54" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Summenstrich und Ergebnis -->
  <path d="M146 336h190" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" fill="none"/>
  <rect x="240" y="356" width="96" height="22" rx="11" fill="#1f2937"/>

  <!-- Eurozeichen -->
  <g transform="translate(378 356)">
    <circle r="66" fill="#1f2937"/>
    <text x="0" y="24" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="82"
          font-weight="700" fill="#ffffff" text-anchor="middle">€</text>
  </g>
</svg>
